name: ColorPad
options:
  bundleIdPrefix: com.harolre
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
targets:
  ColorPad:
    type: application
    platform: iOS
    sources:
      - path: Sources/ColorPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harolre.colorpad
        INFOPLIST_KEY_CFBundleDisplayName: Color-Pad
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Elige una foto para convertirla en una página para colorear."
        INFOPLIST_KEY_NSCameraUsageDescription: "Toma una foto para convertirla en una página para colorear."
  ColorPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ColorPadTests
    dependencies:
      - target: ColorPad
